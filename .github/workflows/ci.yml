name: CI

on:
  push:
    branches: [gh-pages]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (Node.js ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The maintained Node.js release lines, see
        # https://github.com/nodejs/Release#release-schedule
        node-version: [22, 24, 26]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm test

  v8-reference:
    name: V8 reference test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # test/v8-reference-allowlist.json is recorded with the V8 of this
          # Node.js version. Update both together.
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run test-v8-reference
